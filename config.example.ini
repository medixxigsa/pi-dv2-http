# ============================================================================
#  medixxi-pi-dv2-http - configuración
#  Ruta en la Raspberry: /etc/medixxi-pi-dv2-http/config.ini
#  Tras cambiar algo:    sudo systemctl restart medixxi-pi-dv2-http
# ============================================================================

[estacion]
# Identificador de la estación (campo "id" del JSON).
# La consola Davis no tiene número de serie legible, así que con "auto" se usa
# el número de serie de la Raspberry Pi (rpi-xxxx). Mejor poner uno fijo.
id = auto

# Datos descriptivos (opcionales; se envían en el bloque "station").
nombre = Estación meteorológica
ubicacion =

# Coordenadas y altitud (opcionales). Si se dejan vacías se usan las que
# tenga configuradas la consola.
#   latitud / longitud en grados decimales (negativo = Sur / Oeste)
#   altitud en metros sobre el nivel del mar
latitud =
longitud =
altitud =

# Zona horaria para el campo "local_time" (la "timestamp" siempre va en UTC).
zona_horaria = Europe/Madrid

# metric  -> °C, hPa, km/h, mm
# imperial -> °F, inHg, mph, in
unidades = metric

# Tipo de pluviómetro: auto (lo lee de la consola) | 0.2mm | 0.1mm | 0.01in
pluviometro = auto


[consola]
# Puerto USB de la consola. Mejor la ruta estable de /dev/serial/by-id/:
#   ls -l /dev/serial/by-id/
puerto = /dev/ttyUSB0
velocidad = 19200


[destino]
# URL a la que se hace el POST con los datos en JSON.
url = https://example.com/api/weather

# Token opcional: se envía como "Authorization: Bearer <token>".
token =

# Cada cuántos segundos se envía una lectura (la consola actualiza cada ~2 s).
intervalo = 60

# Segundos de espera máxima de respuesta del servidor.
timeout = 10

# Lecturas que se guardan en memoria si el destino no responde.
max_cola = 1000

# Comprobar el certificado HTTPS (déjalo en true salvo certificados propios).
verificar_tls = true


[cabeceras]
# Cabeceras HTTP adicionales, una por línea (opcional). Ejemplo:
# X-Api-Key = abc123
